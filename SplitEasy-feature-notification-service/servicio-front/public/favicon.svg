<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo redondeado oscuro -->
  <rect width="32" height="32" rx="6" fill="#161b22"/>
  <!-- Círculo izquierdo: Pink Lavender -->
  <circle cx="12" cy="16" r="8" fill="#CEB5D4" opacity="0.85"/>
  <!-- Círculo derecho: Cyan Azure -->
  <circle cx="20" cy="16" r="8" fill="#4E7AB1" opacity="0.85"/>
  <!-- Intersección: mezcla más brillante usando multiply blend -->
  <circle cx="20" cy="16" r="8" fill="#4E7AB1" opacity="0.85" style="mix-blend-mode: multiply;"/>
</svg>